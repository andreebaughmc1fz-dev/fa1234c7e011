      - run:
          name: Build color manager
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target colorGamutP3 -j2
      - run:
          name: Map to P3 gamut
          command: LIONSS_LP=1 ./build/colorGamutP3 --conf gamut.cfg --intent perceptual
